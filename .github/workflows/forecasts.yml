name: Save forecasts

on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forecasts

jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: data
          path: data

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install .

      - run: python -m ferry.forecasts data

      - name: Commit new runs
        working-directory: data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add forecasts
          if ! git diff --cached --quiet; then
            git commit -m "Save forecast runs"
            git pull --rebase
            git push
          fi
