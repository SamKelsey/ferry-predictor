name: Poll CalMac

on:
  schedule:
    - cron: '4-59/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: poll

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: data
          path: data

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install .

      - run: python -m ferry.poll data

      - name: Commit changes
        working-directory: data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Log CalMac observations"
            git push
          fi
